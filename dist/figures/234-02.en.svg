<desc id="description">A high-level log does not show what made an agent run slow, costly or wrong.. Support request. NestJS agent. LLM calls. Tool calls. Retrieval store. One HTTP 200 log per run. A. Distributed tracing by span. B. LLM-as-judge evaluations. C. Cost dashboard and alerts. D. Log every prompt in middleware</desc>
