<title id="title">Day 07 · Event Ordering in a Message Queue</title>
<desc id="description">created, paid and cancelled can reach different consumers out of order.. Client. Order service. Standard SQS. Consumer 1. Consumer 2. Consumer 3–5. PostgreSQL. A. SQS FIFO by order. B. Reorder buffer. C. Saga. D. Event versioning</desc>
