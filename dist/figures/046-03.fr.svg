<title id="title">Jour 11 · C · Vérifier, mettre en file et confirmer</title>
<desc id="description">Stripe. Vérifier le HMAC. File interne durable. Worker idempotent. Base des commandes. Notifications. Renvoyer HTTP 200 dès que l’événement est enregistré dans la file.. Dédupliquer par identifiant et vérifier l’état de la commande avant sa mise à jour.</desc>
