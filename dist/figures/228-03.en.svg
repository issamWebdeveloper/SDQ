<title id="title">Day 56 · A · Polling endpoint</title>
<desc id="description">Processing independent of the client. Submit upload. Return a stable job ID. Durable job queue. Video worker. Progress queries. Client polls with job ID. GET /jobs/:id/status. Job state with TTL. Use backoff, meaningful progress states and idempotent processing.</desc>
