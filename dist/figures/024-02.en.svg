<title id="title">Day 06 · Safe Distributed Locks for Cron Jobs</title>
<desc id="description">All three instances compete for the same job every 5 minutes.. Scheduled cron. Application load balancer. Instance A. Instance B. Instance C. Redis lock. Report output. A. SETNX + TTL + fencing token. B. Redlock. C. Pessimistic database lock. D. Optimistic concurrency</desc>
