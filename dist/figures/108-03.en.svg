<title id="title">Day 26 · D · Dual write with an outbox</title>
<desc id="description">Write request. Update and outbox in one transaction. Durable outbox event. Relay with retries. Invalidate cache key. Commit the database change and the outbox event together.. The consumer can resume after failure without losing an invalidation.</desc>
