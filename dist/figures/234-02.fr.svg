<title id="title">Jour 58 · Observer les workflows d’agents LLM</title>
<desc id="description">Un log global n’indique pas quelle étape rend l’exécution lente, coûteuse ou erronée.. Demande de support. Agent NestJS. Appels LLM. Appels d’outils. Index de recherche. Un seul log HTTP 200 par exécution. A. Traçage distribué par span. B. Évaluations par un LLM juge. C. Tableau de coûts et alertes. D. Tracer chaque prompt dans le middleware</desc>
