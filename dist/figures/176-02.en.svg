<desc id="description">Concurrent edits can be overwritten and old local schemas can break synchronization.. Field device offline. Colleague editing online. Local IndexedDB. Online edit. Bulk sync on reconnect. Server database. Conflicts and schema mismatches. A. localStorage + JSON diff. B. IndexedDB and vector clocks. C. Versioned IndexedDB migrations. D. CRDT synchronization engine</desc>
