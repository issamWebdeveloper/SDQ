<title id="title">Jour 33 · A · Event sourcing</title>
<desc id="description">Commande. OrderService. Journal d’événements en ajout seul. Rejeu ou instantané. Projection de lecture. Enregistrer les changements sous forme d’événements. Les rejouer pour reconstruire un état courant ou passé.. Utiliser des instantanés pour éviter de rejouer tout l’historique à chaque chargement.</desc>
