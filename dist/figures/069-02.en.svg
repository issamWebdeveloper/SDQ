<title id="title">Day 17 · Backpressure on an Overwhelmed Consumer</title>
<desc id="description">The consumer falls behind and the producer keeps sending events.. Producer. Kafka topic. Overloaded consumer. PostgreSQL. External HTTP API. A. Drop events. B. Block the producer. C. Increase buffering. D. Rate-limit and shed load</desc>
