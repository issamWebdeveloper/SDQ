<title id="title">Jour 49 · D · Partitionner par date, regrouper par client</title>
<desc id="description">Avant · parcours étendu. Filtre par date et par client. Parcourir une large partie de la table. Volume parcouru élevé. Après · partitionnement et clustering. Même requête. Écarter les partitions de dates. Ignorer les blocs des autres clients. Lire la tranche correspondante. L’élagage réduit les dates parcourues. Le clustering réduit les blocs lus dans chaque date.</desc>
