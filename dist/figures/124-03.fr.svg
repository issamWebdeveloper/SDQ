<desc id="description">Client envoyant le fichier. Service d’envoi. Amazon S3. Pipeline ML via événements S3. Audit par clé d’objet. Classe d’archivage Glacier. Conserver la clé d’objet en base pour que chaque service lise le même objet.. Transférer les données froides vers un stockage moins coûteux avec les règles de cycle de vie.</desc>
