<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="342" viewBox="0 0 1120 342" xml:lang="fr" role="img" aria-labelledby="title description">
<title id="title">Jour 26 · D · Double écriture avec une outbox</title>
<desc id="description">Requête d’écriture. Mise à jour et outbox dans une transaction. Événement durable dans l’outbox. Relais avec nouvelles tentatives. Invalider la clé en cache. Valider ensemble le changement en base et son événement outbox.. Le consommateur peut reprendre après une panne sans perdre d’invalidation.</desc>
